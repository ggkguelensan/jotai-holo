name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm docs:check
      - run: pnpm docs:build
      - run: pnpm test:docs
      - run: pnpm test:package
      - run: pnpm test:memory
      - run: pnpm test:model-memory

  react-compat:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        react: ['18.0.0', '18.3.1', '19.3.1']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:react
        env:
          REACT_VERSION: ${{ matrix.react }}
